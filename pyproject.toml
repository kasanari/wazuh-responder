[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/wazuh_responder"]

[project]
name = "wazuh-responder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.34.2",
    "tyro>=1.0.13",
]

# entrypoint
[project.scripts]
wazuh-responder = "wazuh_responder.main:cli"
